services:
  postgres:
    image: postgres:16-alpine
    container_name: lexilearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexilearn
      POSTGRES_PASSWORD: lexilearn
      POSTGRES_DB: lexilearn
    ports:
      - "5433:5432"
    volumes:
      - lexilearn_pg:/var/lib/postgresql/data

volumes:
  lexilearn_pg:
