services:
  postgres:
    image: postgres:16-alpine
    container_name: evilwords-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evilwords
      POSTGRES_PASSWORD: evilwords
      POSTGRES_DB: evilwords
    ports:
      - "5433:5432"
    volumes:
      - evilwords_pg:/var/lib/postgresql/data

volumes:
  evilwords_pg:
